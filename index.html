<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Мессенджер</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <h1>Регистрация</h1>

        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" placeholder="Ваш логин">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="Минимум 6 символов">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Повторите пароль</label>
                <input type="password" id="confirmPassword" placeholder="Повторите пароль">
            </div>

            <div id="errorMessage" class="error-message"></div>

            <button type="submit">Зарегистрироваться</button>
        </form>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
